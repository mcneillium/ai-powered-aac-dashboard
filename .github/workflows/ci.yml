name: CI

# Build and test the caregiver dashboard on every PR.
#
# No secrets and no deploy step. Firebase Hosting deployment stays a manual,
# supervised action — and note that a `firebase deploy` from this repo currently
# also replaces the "default" functions codebase, which would delete all five of
# the mobile app's Cloud Functions including the log-retention job. See the app
# repo's BACKLOG.md item B-5.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - run: npm ci

      - name: Tests
        env:
          CI: 'true'
        run: npx craco test --watchAll=false --passWithNoTests

      - name: Production build
        env:
          # CRA promotes warnings to errors when CI is truthy. That is a useful
          # gate in principle, but this tree has pre-existing warnings and
          # failing the build on them would make the workflow red on arrival,
          # which trains everyone to ignore it. Turn it on once the warnings
          # are cleared.
          CI: ''
          # Placeholders only. No real Firebase config is configured for this
          # workflow; the build is checking that it compiles, not that it runs.
          REACT_APP_FIREBASE_API_KEY: ci-placeholder
          REACT_APP_FIREBASE_AUTH_DOMAIN: ci.example.invalid
          REACT_APP_FIREBASE_DATABASE_URL: https://ci.example.invalid
          REACT_APP_FIREBASE_PROJECT_ID: ci-placeholder
          REACT_APP_FIREBASE_STORAGE_BUCKET: ci.example.invalid
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          REACT_APP_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
        run: npm run build

      - name: Schema parity with the mobile app
        # src/shared/schema.js is hand-duplicated across two repos and has
        # already drifted by five paths and four field groups. This step is a
        # placeholder for the real parity check described in the app repo's
        # BACKLOG.md item DC-F15 — it needs both repos checked out, so it is
        # documented here rather than silently omitted.
        run: echo "TODO — needs a checkout of ai-powered-aac-app; see BACKLOG.md DC-F15"
